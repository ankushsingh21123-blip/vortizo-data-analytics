# PostgreSQL path. Docker was not available on the build VM, so this
# path is code-reviewed only, not live-tested. The default local run
# uses SQLite and needs no Docker at all.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://analytics:analytics@db:5432/analytics
      DATASET_PATH: data/dataset.csv
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
